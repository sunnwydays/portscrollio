            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<body class="bg-background text-on-background font-body overflow-hidden">
<!-- Top App Bar Shell -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-6 h-16 bg-[#0b1326]/80 backdrop-blur-lg dark:bg-[#0b1326]/80 bg-gradient-to-b from-[#131b2e] to-transparent shadow-none">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full overflow-hidden border border-primary/20">
<img alt="User profile photo" class="w-full h-full object-cover" data-alt="Portrait of a young male engineer" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC3qEWySiyhkIncZFsL9kOdhtWuT2CjOVa-tqYsqHJhJ5P7Z_0zXvTYq_uFpPj2H0L6RAZd7_2LCdl79OaDQvtpOh_qGO134U4Hf8sJid6pMs3vJEjYJbuhGWd29w3UJQbpnJNoYZgivMwlaPMDSaXl-MZEZAbhfn_TdYhzis6lVrvY03VCK3aNBlPxii1FPPL1LyskQx12bPpHvrcjNB_IOZw6y_17UbjcYl4z6CuhHaSZIm-C7Ckng5lHMYih1kkUUiywljhCfNo"/>
</div>
<span class="text-lg font-black tracking-tighter text-[#10b981] font-manrope">Luminous</span>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-[#222a3d] transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined text-[#dae2fd]">menu</span>
</button>
</header>
<!-- Background Content (Blurred Project Feed) -->
<main class="relative h-screen w-full overflow-hidden bg-surface-container-lowest">
<!-- Mock Video Feed Item -->
<div class="h-full w-full relative blur-md grayscale-[0.2]">
<img alt="Background Project" class="w-full h-full object-cover" data-alt="Abstract robotic arm and glowing circuit patterns" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCIaNUqNZbjj5_ixwehfW8Cp0oHwqRyRxEH8iAuIZ00OOPmhFAk9IPyWI7nupCqEAagsViCV2VCm8WnzYoh3Z2jTGRw14vk8XH9beZNKjqBUoJtjkYjsdyPfPBBPKptTz8aQV52qUq69J-oZyK055fXC6rt4vRVozAE2S4wFXaYZQu7NZni3LQGS25Vv3yESs3zokHGjxRhNOcvmWDH6Onar5Lcc9l_qjjgxEQcbQOcToxlZoYqifeotmx1WqHNMJRydo82jwddLq0"/>
<div class="absolute inset-0 bg-gradient-to-t from-background via-transparent to-transparent opacity-80"></div>
</div>
<!-- Scrim for Drawer -->
<div class="absolute inset-0 bg-surface-container-lowest/40 backdrop-blur-[2px] z-40"></div>
</main>
<!-- Navigation Drawer (Side Panel Overlay) -->
<aside class="fixed inset-y-0 left-0 z-50 h-full w-[85%] max-w-[320px] rounded-r-3xl bg-[#0b1326]/60 backdrop-blur-2xl border-r border-white/10 shadow-[20px_0_80px_-15px_rgba(0,0,0,0.5)] flex flex-col p-6 gap-4 transform transition-transform duration-300">
<!-- Header Profile -->
<div class="flex flex-col items-start gap-4 mb-4 border-b border-white/5 pb-6">
<div class="relative">
<div class="w-20 h-20 rounded-2xl overflow-hidden shadow-lg border-2 border-primary/30">
<img alt="Profile avatar" class="w-full h-full object-cover" data-alt="Portrait of Sunny looking at camera" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAadAX6GWYsdr_bsXiDz52Aifw4W0AfncbMsv_RqicicirAnHCX5YPv9FbqkCCYMaGlWQNr253l7wM9fFuNucy3NldiKdEkmxxS0QH1W_3XSi5zLV-6B57a7c5TELlCPIyrw8sp6b4Li52kjkMfRprc7Cz5dsUCzQq2k57P7scF_bodAmj32keFeWZYHEuCkT_b_gKfvzeA-OJ_i5QXvjUkRPCi7OeP4xHXTvrIWOz4LXonxw0SVy8WNEZJnq8TrbeijEjmEm_BU6U"/>
</div>
<div class="absolute -bottom-1 -right-1 w-6 h-6 bg-primary rounded-full border-2 border-background flex items-center justify-center">
<span class="material-symbols-outlined text-[12px] text-on-primary font-bold" style="font-variation-settings: 'FILL' 1;">bolt</span>
</div>
</div>
<div>
<h1 class="text-xl font-manrope font-bold text-white">Sunny</h1>
<p class="text-sm font-medium text-secondary/90 tracking-tight">UofT Computer Engineering</p>
<div class="mt-2 flex items-center gap-2">
<span class="flex h-2 w-2 rounded-full bg-primary animate-pulse"></span>
<span class="text-xs font-inter text-white/60 font-medium">Building at @UofT</span>
</div>
</div>
</div>
<!-- ACTIVITY_FEED Section -->
<div class="space-y-6 flex-1 overflow-y-auto pr-1">
<div class="flex items-center justify-between">
<span class="text-[10px] uppercase tracking-widest font-bold text-white/40">Activity Feed</span>
<span class="text-[10px] text-white/20 font-mono">v1.0.4</span>
</div>
<!-- Stats Grid -->
<div class="space-y-4">
<!-- Last Commit -->
<div class="p-4 rounded-xl bg-white/5 border border-white/10 border-l-2 border-l-primary/50 transition-all duration-300 ease-in-out active:scale-[0.98]">
<div class="flex items-center gap-3 mb-2">
<span class="material-symbols-outlined text-primary text-xl">history</span>
<span class="text-xs font-semibold text-white/60">Last Commit</span>
</div>
<p class="text-sm font-medium text-white/90">Updated Chrome Ext manifest</p>
</div>
<!-- Robot Arm Progress -->
<div class="p-4 rounded-xl bg-white/5 border border-white/10 transition-all duration-300 ease-in-out active:scale-[0.98]">
<div class="flex items-center justify-between mb-3">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-secondary text-xl">trending_up</span>
<span class="text-xs font-semibold text-white/60">Project Progress</span>
</div>
<span class="text-xs font-bold text-white/40">0%</span>
</div>
<div class="w-full h-1.5 bg-white/10 rounded-full overflow-hidden">
<div class="h-full bg-primary/40 w-[2%] rounded-full shadow-[0_0_8px_rgba(16,185,129,0.3)]"></div>
</div>
<p class="text-[11px] mt-2 text-white/40 text-right italic">Robot Arm Automation</p>
</div>
<!-- Power Clean 3RM -->
<div class="p-4 rounded-xl bg-white/5 border border-white/10 transition-all duration-300 ease-in-out active:scale-[0.98]">
<div class="flex items-center gap-3 mb-1">
<span class="material-symbols-outlined text-[#ffb3af] text-xl">fitness_center</span>
<span class="text-xs font-semibold text-white/60">Power Clean 3RM</span>
</div>
<div class="flex items-baseline gap-1">
<span class="text-2xl font-bold text-white/90">100</span>
<span class="text-sm font-medium text-white/40">kg</span>
</div>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="mt-auto space-y-3 pt-6 border-t border-white/5">
<button class="w-full flex items-center justify-between p-3 rounded-xl text-white/70 hover:bg-white/10 hover:text-white transition-all duration-300 ease-in-out group bg-white/5 border border-white/5">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined">description</span>
<span class="font-inter text-sm font-medium">Resume</span>
</div>
<span class="material-symbols-outlined text-sm opacity-40 group-hover:opacity-100 transform translate-x-[-4px] group-hover:translate-x-0 transition-all">north_east</span>
</button>
<button class="w-full flex items-center justify-between p-3 rounded-xl text-white/70 hover:bg-white/10 hover:text-white transition-all duration-300 ease-in-out group bg-white/5 border border-white/5">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined">code</span>
<span class="font-inter text-sm font-medium">GitHub</span>
</div>
<span class="material-symbols-outlined text-sm opacity-40 group-hover:opacity-100 transform translate-x-[-4px] group-hover:translate-x-0 transition-all">north_east</span>
</button>
</div>
</aside>

<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-8 pb-8 pt-4 bg-[#0b1326]/60 backdrop-blur-2xl dark:bg-[#0b1326]/60 rounded-t-[2rem] shadow-[0_-10px_40px_rgba(6,14,32,0.8)] z-50">
<!-- For You (Active) -->
<a class="flex flex-col items-center justify-center text-[#10b981] bg-[#10b981]/10 rounded-full px-6 py-2 active:scale-90 duration-150" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
<span class="font-inter text-[10px] uppercase tracking-widest font-bold">For You</span>
</a>
<!-- Explore (Inactive) -->
<a class="flex flex-col items-center justify-center text-[#dae2fd] opacity-50 hover:opacity-100 transition-opacity active:scale-90 duration-150" href="#">
<span class="material-symbols-outlined mb-1">explore</span>
<span class="font-inter text-[10px] uppercase tracking-widest font-bold">Explore</span>
</a>
</nav>
</body></html>
